<!doctype html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>T</title>
<style>
  :root{
    --bg:#f6f1e7;
    --text:#2b2620;
    --muted:#8a8172;
    --line:#e2d9c6;
    --panel:#fbf7ee;
    --accent:#2b2620;
    --overlay:rgba(43,38,32,.4);
    --shadow:0 20px 44px -20px rgba(60,45,20,.28);
    --view:#2b2620;
  }
  [data-theme="dark"]{
    --bg:#14120f;
    --bg-2:#181510;
    --text:#d8cfc1;
    --muted:#8a8074;
    --line:#2a2620;
    --panel:#1b1813;
    --accent:#d8cfc1;
    --overlay:rgba(0,0,0,.7);
    --shadow:0 22px 50px -22px rgba(0,0,0,.75);
    --view:#f0eae0;
  }
  @media (prefers-color-scheme: dark){
    [data-theme="auto"]{
      --bg:#14120f;
      --bg-2:#181510;
      --text:#d8cfc1;
      --muted:#8a8074;
      --line:#2a2620;
      --panel:#1b1813;
      --accent:#d8cfc1;
      --overlay:rgba(0,0,0,.7);
      --shadow:0 22px 50px -22px rgba(0,0,0,.75);
      --view:#f0eae0;
    }
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 50% -10%, var(--bg-2), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    background-repeat:no-repeat;
    background-size:cover;
    color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
    transition:background-color .3s ease, color .3s ease;
    overflow-y:auto;
  }
  .wrap{
    max-width:680px; margin:0 auto;
    padding:46px 30px 120px;
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .bar{
    display:flex; align-items:center; justify-content:space-between;
    gap:20px; margin-bottom:26px;
    font-size:15px; color:var(--muted);
    user-select:none;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:30;
    flex:0 0 auto;
  }
   .bar-left, .bar-right{
    display:flex; align-items:center; gap:14px;
  }
  .bar-left {
    flex: 1;
    justify-content: flex-start;
  }
  .bar-right {
    flex: 1;
    justify-content: flex-end;
  }
  .bar-center {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .sizer{
    display:flex; align-items:center; gap:2px;
  }
  .sizer button{
    appearance:none; border:0; background:transparent;
    color:var(--muted); font:inherit;
    font-size:26px; line-height:1;
    width:30px; height:32px;
    display:grid; place-items:center;
    padding:0; cursor:default;
  }
  .sizer button:focus{outline:none}
  .fontwrap{
    position:relative;
    display:inline-flex; align-items:center;
  }
  .fontwrap .glyph{
    color:var(--muted);
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px; line-height:1;
    user-select:none;
    padding:0;
    background:none;
    border:0;
    cursor:default;
    -webkit-tap-highlight-color:transparent;
  }
  .fontwrap .glyph:focus{outline:none}
  .fontwrap .glyph::selection{background:transparent}
  .view{
    appearance:none; border:0;
    background:var(--muted);
    color:var(--bg);
    padding:2px 6px;
    border-radius:4px;
    cursor:default;
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px; 
    line-height:1.2;
    letter-spacing:-.02em;
    margin-left:10px;
    -webkit-tap-highlight-color:transparent;
  }
  .view:focus{outline:none}
  .fontmenu{
    position:absolute; top:calc(100% + 12px); left:-14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:6px;
    display:none;
    z-index:100;
    font-family:Georgia,"Times New Roman",serif;
    white-space:nowrap;
    width:max-content;
  }
  .fontmenu.open{display:block}
  .fontmenu button{
    display:flex; align-items:baseline; justify-content:flex-start;
    width:100%;
    appearance:none; border:0; background:transparent;
    color:var(--text); font:inherit; font-size:15px;
    padding:8px 12px;
    border-radius:6px;
    cursor:default;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
  }
  .fontmenu button:hover{background:rgba(127,127,127,.12)}
  .fontmenu button.active{color:var(--accent); font-weight:700}
  .editor{
    width:100%;
    flex:1 1 auto;
    min-height:40vh;
    border:0; outline:none; resize:none;
    background:transparent; color:var(--text);
    font:inherit; line-height:1.75;
    padding:0;
    letter-spacing:.005em;
    overflow:hidden;
    position:relative;
    z-index:1;
  }
  .editor::placeholder{color:var(--muted); font-style:italic; opacity:.7}
  .foot{
    display:flex; align-items:center; justify-content:flex-end;
    margin-top:44px;
    flex:0 0 auto;
  }
  .foot .convert{
    appearance:none; border:0; background:transparent;
    color:var(--muted); font:inherit;
    font-size:34px; line-height:1;
    padding:6px 10px; cursor:default;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    -webkit-tap-highlight-color:transparent;
  }
  .foot .convert:focus{outline:none}
  .overlay{
    position:fixed; inset:0; background:var(--overlay);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:50;
    backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex}
  .modal{
    position:relative;
    background:var(--panel); color:var(--text);
    border-radius:12px; padding:34px 28px 26px;
    width:100%; max-width:420px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    font-family:Georgia,"Times New Roman",serif;
  }
  .passrow{
    display:grid;
    grid-template-columns:60px 1fr auto auto;
    gap:10px; align-items:stretch;
  }
  .passrow .pw{
    width:100%; padding:14px 16px; font-size:18px;
    background:transparent; color:inherit;
    border:1px solid var(--line); border-radius:8px; outline:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.22em; text-align:center;
    -webkit-text-security:disc;
  }
  .passrow .pw:focus{border-color:var(--text)}
  .passrow .pw::placeholder{color:var(--muted); letter-spacing:normal; font-family:inherit; font-size:14px}
  .passrow .act{
    appearance:none; cursor:default; font:inherit; font-size:20px; font-weight:700;
    border:1px solid var(--line); background:transparent; color:var(--text);
    border-radius:8px;
    -webkit-tap-highlight-color:transparent;
    padding: 0 12px;
  }
  .passrow .act:hover{border-color:var(--text)}
  .passrow .act[disabled]{opacity:.4}
  .passrow .act.pack{background:var(--accent); color:var(--bg); border-color:var(--accent)}
  .passrow .act.pack:hover{opacity:.85}
  .passrow .act.qr-btn.active {
    background: var(--muted);
    color: var(--bg);
    border-color: var(--muted);
  }
  .passrow .qr-btn {
    font-size: 14px;
    font-weight: 400;
    padding: 0 10px;
    letter-spacing: 0;
  }
  .modal-status{
    margin-top:16px; font-size:13px; color:var(--muted); min-height:18px;
    text-align:center;
  }
  .modal-status.err{color:#a8442f}
  .modal-status.ok{color:#4a7a3a}
  .lang, .dl, .help {
    appearance:none; 
    border:0 !important; 
    background:transparent !important;
    color:var(--muted); 
    font-family:Georgia,"Times New Roman",serif;
    font-size:22px; 
    line-height:1; 
    padding:0; 
    cursor:default;
    display:inline-flex; 
    align-items:center; 
    justify-content:center;
    border-radius:0;
    -webkit-tap-highlight-color:transparent;
  }
  .lang:focus, .dl:focus, .help:focus{outline:none}
  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    padding:12px 20px; border-radius:8px; box-shadow:var(--shadow);
    font-size:14px; opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease; z-index:100;
    text-align:center; line-height:1.4; max-width:80%;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #qrModal {
    background: var(--overlay); 
    backdrop-filter: blur(2px);
  }
  #qrModal.open { display: flex; }
  #qrCanvas { 
    display: block;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
    border-radius: 8px;
  }
  #infoModal .modal, #donateModal .modal {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 40px 28px 28px;
    text-align: left;
  }
  .info-text {
    font-size: 15px;
    line-height: 1.6;
    margin: 0;
    color: var(--text);
    text-align: left;
    width: 100%;
    word-break: break-word;
    overflow-wrap: break-word;
    overflow-y: auto;
    padding-right: 8px;
    max-height: 65vh;
    scrollbar-width: none;
  }
  .info-text::-webkit-scrollbar {
    display: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="bar-left">
      <div class="sizer">
        <button id="dec" aria-label="Меньше">−</button>
        <button id="inc" aria-label="Больше">+</button>
      </div>
      <div class="fontwrap" id="fontwrap">
        <button type="button" class="glyph" id="fontGlyph" aria-label="Шрифт">𝓐𝕒</button>
        <div class="fontmenu" id="fontMenu" role="menu" aria-label="Шрифт"></div>
        <button class="view" id="view" aria-label="Тема">𝓐𝕒</button>
      </div>
    </div>
    
    <div class="bar-right">
        <button class="dl" id="download">🡇</button>
        <button class="help" id="help">▤</button>
        <button class="help" id="donate">♥</button>
        <button class="lang" id="lang">𝓔𝓝</button>
    </div>
  </div>

  <textarea class="editor" id="editor" placeholder="Ввод..." spellcheck="false"></textarea>

  <div class="foot">
    <button class="convert" id="go" aria-label="Преобразовать">#</button>
  </div>
</div>    
      
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
      <div class="passrow">
      <button class="act" id="btnUnpack">↶</button>
      <input class="pw" id="pw" type="text" maxlength="10" placeholder="••••••••••" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="nope-please-ignore" aria-label="Поле">
      <button class="act qr-btn" id="btnQr">Кьюар</button>
      <button class="act pack" id="btnPack">→</button>
    </div>
    <div class="modal-status" id="modalStatus" aria-live="polite"></div>
  </div>
</div>

<div class="overlay" id="qrModal">
  <canvas id="qrCanvas"></canvas>
</div>

<div class="overlay" id="infoModal">
  <div class="modal" role="dialog" aria-modal="true">
    <p class="info-text" id="infoText"></p>
  </div>
</div>

<div class="overlay" id="donateModal">
  <div class="modal" role="dialog" aria-modal="true">
    <p class="info-text" id="donateText"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const A = 'KQRBNabcdefgh12345678x=+#-KQRBNabcdefgh12345678x=+#-_';
  const L = (() => { const m = Object.create(null); for (let i = 0; i < A.length; i++) m[A[i]] = i; return m; })();
  const HASH_LIMIT = 24000;

  const wf = (v) => {
    const s = String(v ?? '');
    if (typeof s.toWellFormed === 'function') return s.toWellFormed();
    let o = '';
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c >= 0xd800 && c <= 0xdbff) {
        const n = s.charCodeAt(i + 1);
        if (n >= 0xdc00 && n <= 0xdfff) { o += s[i] + s[i + 1]; i++; }
        else o += '\uFFFD';
      } else if (c >= 0xdc00 && c <= 0xdfff) o += '\uFFFD';
      else o += s[i];
    }
    return o;
  };

  const zc = (input) => {
    const s = wf(input);
    if (!s) return '';
    const d = Object.create(null);
    const tc = Object.create(null);
    let ds = 3, nb = 2, ei = 2, w = '';
    const st = { out: [], v: 0, p: 0 };
    const em = (bit) => {
      st.v = (st.v << 1) | bit;
      if (st.p === 5) { st.out.push(A[st.v]); st.v = 0; st.p = 0; }
      else st.p++;
    };
    const fl = () => {
      if (w in tc) {
        if (w.charCodeAt(0) < 256) {
          for (let k = 0; k < nb; k++) em(0);
          let v = w.charCodeAt(0);
          for (let k = 0; k < 8; k++) { em(v & 1); v >>= 1; }
        } else {
          let v = 1;
          for (let k = 0; k < nb; k++) { em(v & 1); v >>= 1; }
          let vv = w.charCodeAt(0);
          for (let k = 0; k < 16; k++) { em(vv & 1); vv >>= 1; }
        }
        ei--;
        if (ei === 0) { ei = 2 ** nb; nb++; }
        delete tc[w];
      } else {
        let v = d[w];
        for (let k = 0; k < nb; k++) { em(v & 1); v >>= 1; }
      }
      ei--;
      if (ei === 0) { ei = 2 ** nb; nb++; }
    };
    for (let i = 0; i < s.length; i++) {
      const c = s.charAt(i);
      if (!(c in d)) { d[c] = ds++; tc[c] = true; }
      const wc = w + c;
      if (wc in d) { w = wc; continue; }
      fl();
      d[wc] = ds++;
      w = String(c);
    }
    if (w !== '') fl();
    let v = 2;
    for (let k = 0; k < nb; k++) { em(v & 1); v >>= 1; }
    while (true) {
      st.v <<= 1;
      if (st.p === 5) { st.out.push(A[st.v]); break; }
      st.p++;
    }
    return st.out.join('');
  };

  const rb = (n, data, len, get) => {
    let bits = 0, power = 1;
    const max = 2 ** n;
    while (power !== max) {
      const resb = data.val & data.pos;
      data.pos >>= 1;
      if (data.pos === 0) {
        data.pos = 32;
        if (data.i < len) data.val = get(data.i);
        data.i++;
      }
      bits |= (resb > 0 ? 1 : 0) * power;
      power <<= 1;
    }
    return bits;
  };

  const zd = (input) => {
    if (input == null) return null;
    if (input === '') return '';
    const get = (i) => L[input.charAt(i)];
    const data = { val: get(0), pos: 32, i: 1 };
    if (data.val == null) return null;
    const d = [0, 1, 2];
    let ei = 4, ds = 4, nb = 3, en = '';
    const res = [];
    const next = rb(2, data, input.length, get);
    let c;
    if (next === 0) c = String.fromCharCode(rb(8, data, input.length, get));
    else if (next === 1) c = String.fromCharCode(rb(16, data, input.length, get));
    else if (next === 2) return '';
    else return null;
    d[3] = c;
    let w = c;
    res.push(c);
    while (true) {
      if (data.i > input.length) return null;
      let bits = rb(nb, data, input.length, get);
      if (bits === 0) {
        d[ds] = String.fromCharCode(rb(8, data, input.length, get));
        bits = ds++; ei--;
      } else if (bits === 1) {
        d[ds] = String.fromCharCode(rb(16, data, input.length, get));
        bits = ds++; ei--;
      } else if (bits === 2) {
        return res.join('');
      }
      if (ei === 0) { ei = 2 ** nb; nb++; }
      if (d[bits] !== undefined) en = d[bits];
      else if (bits === ds) en = w + w.charAt(0);
      else return null;
      res.push(en);
      d[ds++] = w + en.charAt(0);
      ei--; w = en;
      if (ei === 0) { ei = 2 ** nb; nb++; }
    }
  };

  const te = new TextEncoder();
  const td = new TextDecoder();

  const u8b = (bytes) => {
    let bin = '';
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
  };
  const bu8 = (s) => {
    s = String(s || '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };

  const dk = async (pw, salt) => {
    const km = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  };

  const ep = async (text, pw) => {
    const z = zc(text);
    if (!z) return '';
    const data = te.encode(z);
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await dk(pw, salt);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data));
    const out = new Uint8Array(1 + 16 + 12 + ct.length);
    out[0] = 1;
    out.set(salt, 1);
    out.set(iv, 17);
    out.set(ct, 29);
    return u8b(out);
  };

  const dp = async (hash, pw) => {
    try {
      const raw = bu8(String(hash || '').trim());
      if (raw.length < 1 + 16 + 12 + 16) return null;
      if (raw[0] !== 1) return null;
      const salt = raw.slice(1, 17);
      const iv = raw.slice(17, 29);
      const ct = raw.slice(29);
      const key = await dk(pw, salt);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
      return zd(td.decode(pt));
    } catch { return null; }
  };

  const getQRMatrix = (text) => {
    const len = text.length;
    let type = 1;
    for (let i = 1; i <= 40; i++) {
      const cap = i < 10 ? 150 - i * 4 : 580 - i * 8; 
      if (len * 8 + 12 < cap) { type = i; break; }
    }
    const size = type * 4 + 17;
    const matrix = Array(size).fill(0).map(() => Array(size).fill(0));
    const reserved = Array(size).fill(0).map(() => Array(size).fill(false));

    const setFinder = (r, c) => {
      for (let i = -1; i <= 7; i++) {
        for (let j = -1; j <= 7; j++) {
          const rr = r + i, cc = c + j;
          if (rr >= 0 && rr < size && cc >= 0 && cc < size) {
            matrix[rr][cc] = (i >= 0 && i <= 6 && (j === 0 || j === 6)) ||
                             (j >= 0 && j <= 6 && (i === 0 || i === 6)) ||
                             (i >= 2 && i <= 4 && j >= 2 && j <= 4) ? 1 : 0;
            reserved[rr][cc] = true;
          }
        }
      }
    };

    setFinder(0, 0); setFinder(0, size - 7); setFinder(size - 7, 0);

    for (let i = 8; i < size - 8; i++) {
      matrix[6][i] = i % 2 === 0 ? 1 : 0; reserved[6][i] = true;
      matrix[i][6] = i % 2 === 0 ? 1 : 0; reserved[i][6] = true;
    }

    for (let i = 0; i < 9; i++) {
      if (i !== 6) { reserved[8][i] = true; reserved[i][8] = true; }
    }
    for (let i = 0; i < 8; i++) {
      if (i !== 6) {
        reserved[8][size - 1 - i] = true;
        reserved[size - 1 - i][8] = true;
      }
    }
    reserved[8][8] = true;

    for (let i = 9; i < size - 8; i++) reserved[8][i] = true;
    for (let i = 9; i < size - 8; i++) reserved[i][8] = true;

    const bits = [];
    bits.push(0, 1, 0, 0);
    for (let i = 7; i >= 0; i--) bits.push((len >> i) & 1);
    for (let i = 0; i < len; i++) {
      const code = text.charCodeAt(i);
      for (let b = 7; b >= 0; b--) bits.push((code >> b) & 1);
    }
    bits.push(0, 0, 0, 0);

    const totalBits = size * size;
    let remaining = totalBits;
    reserved.forEach(row => row.forEach(r => { if (r) remaining--; }));
    
    while (bits.length % 8 !== 0) bits.push(0);
    let pad = 0xEC;
    while (bits.length < remaining) {
      for (let b = 7; b >= 0; b--) bits.push((pad >> b) & 1);
      pad = pad === 0xEC ? 0x11 : 0xEC;
    }

    let dir = -1;
    let row = size - 1;
    let col = size - 1;
    let bitIdx = 0;

    while (col > 0) {
      if (col === 6) col--;
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < 2; j++) {
          const c = col - j;
          if (!reserved[row][c] && bitIdx < bits.length) {
            matrix[row][c] = bits[bitIdx++];
          }
        }
        row += dir;
        if (row < 0 || row >= size) {
          row -= dir;
          dir = -dir;
          break;
        }
      }
      col -= 2;
    }
    return matrix;
  };

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const editor = $('editor');
  const overlay = $('overlay');
  const pwInput = $('pw');
  const modalStatus = $('modalStatus');
  const btnPack = $('btnPack');
  const btnUnpack = $('btnUnpack');
  const btnQr = $('btnQr');
  const view = $('view');
  const fontwrap = $('fontwrap');
  const fontMenu = $('fontMenu');
  const fontGlyph = $('fontGlyph');
  const langBtn = $('lang');
  const downloadBtn = $('download');
  const helpBtn = $('help');
  const toastEl = $('toast');
  const qrModal = $('qrModal');
  const qrCanvas = $('qrCanvas');
  const infoModal = $('infoModal');
  const donateModal = $('donateModal');
  const donateText = $('donateText');
  const infoText = $('infoText');

  const FONTS = [
    { name: 'Временной',        enName: 'Times',         stack: "'Times New Roman', Times, serif" },
    { name: 'Антенный',        enName: 'Arial',         stack: "Arial, Helvetica, sans-serif" },
    { name: 'Грузинский',      enName: 'Georgia',       stack: "Georgia, 'Times New Roman', serif" },
    { name: 'Старокнижный', enName: 'Antiqua',      stack: "'Book Antiqua', Palatino, serif" },
    { name: 'Баскервильский',  enName: 'Baskerville',   stack: "'Baskerville', 'Libre Baskerville', Georgia, serif" },
    { name: 'Швейцарский',    enName: 'Helvetica',     stack: "'Helvetica Neue', Helvetica, Arial, sans-serif" },
    { name: 'Курьерский',      enName: 'Courier',       stack: "'Courier New', Courier, monospace" },
    { name: 'Моноширинный',         enName: 'Monospace',     stack: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" },
    { name: 'Верданский',      enName: 'Verdana',       stack: "'Verdana', Geneva, sans-serif" }
  ];

  let isEN = false;

  const i18n = {
    ru: {
      title: 'Текстиньо. Текст в ссылке',
      placeholder: 'Ввод...',
      packTitle: 'Упаковать',
      unpackTitle: 'Распаковать',
      errEmpty: 'Пусто',
      errLen: '10 символов',
      errLong: 'Сократите',
      errFail: 'Нет',
      errError: 'Ошибка',
      msgSaved: 'Пользуйся офлайн. Усиль, изменив порядок алфавита в коде',
      infoText: 'Текстиньо.  Автономный инструмент для упаковки текста в ссылку с шифрованием паролем. Интерфейс, кодирование, сжатие, отрисовка кьюара реализованы внутри одного файла без обращения к внешним ресурсам или серверу. Нет отправки текста, пароля или кодировки на серверы и сторонние сервисы: нет fetch, XHR, WebSocket и внешних библиотек. После загрузки страницы обработка данных выполняется исключительно в браузере. Текст сжимается встроенной реализацией LZ-string-подобного алгоритма, затем преобразовывается через Web Crypto API: AES-256-GCM. Ключ выводится из введённого пароля алгоритмом PBKDF2-HMAC-SHA-256 с 200 000 итераций. Для каждого преобразования генерируются случайные 16-байтная соль и 12-байтный IV. Результат кодируется в Base64 URL-safe и записывается в текстовое поле редактора и во фрагмент адреса после #. При распаковке данные берутся из редактора или адресной строки, пароль проверяется попыткой распаковки; при неверном пароле AES-GCM не проходит проверку целостности. Ссылка фактически становится контейнером зашифрованного сообщения. Кнопка скачивания сохраняет файл приложения и позволяет работать с ним локально, без интернета. Предлагается усилить эффект изменением алфавита в коде. Размер шрифта, выбранный шрифт и тема сохраняются в localStorage. Сам текст и пароль кодом туда не записываются. Фрагмент адреса после # не входит в HTTP-запрос при загрузке страницы, поэтому сам по себе не отправляется серверу. Ссылка с текстом остаётся в адресной строке и может быть скопирована, переслана, сохранена или передана через кьюар. Это не открытый текст, для чтения получателю понадобится пароль.',
      donateText: 'bc1qqx8qn6jd6jn7vstjp86n990thzlkmvauu2wyha',
      qrBtn: 'Кьюар'
    },
    en: {
      title: 'Textinho. Text in the link',
      placeholder: 'Input...',
      packTitle: 'Pack',
      unpackTitle: 'Unpack',
      errEmpty: 'Empty',
      errLen: '10 characters',
      errLong: 'Shorten text',
      errFail: 'None',
      errError: 'Error',
      msgSaved: 'Use offline. Enhance by changing the alphabet order in the code',
      infoText: 'Textinho. Autonomous. The interface, encoding, compression, and QR-code rendering are implemented in a single file, with no calls to external resources or servers. No text, password, or encoded data is sent to servers or third-party services: there are no fetch, XHR, or WebSocket requests and no external libraries. Once the page has loaded, all data processing takes place exclusively in the browser.The text is compressed using a built-in LZ-string-like algorithm, then transformed through the Web Crypto API using AES-256-GCM. The key is derived from the entered password using PBKDF2-HMAC-SHA-256 with 200,000 iterations. A random 16-byte salt and a 12-byte IV are generated for each transformation. The result is encoded in URL-safe Base64 and placed in the editor’s text field and in the URL fragment after #.When unpacking, data is taken from the editor or the address bar. The password is checked by attempting to unpack the data; with an incorrect password, AES-GCM fails its integrity check. The download button saves the application file, allowing it to be used locally without an internet connection. The app suggests enhancing the effect by changing the alphabet in the code.The font size, selected font, and theme are saved in localStorage. The code does not store the text or password there. The URL fragment after # is not included in the HTTP request when the page loads, so it is not sent to the server by itself. A link containing the text remains in the address bar and can be copied, forwarded, saved, or shared via QR code. It is not plain text; the recipient needs the password to read it.',
      donateText: 'bc1qqx8qn6jd6jn7vstjp86n990thzlkmvauu2wyha',
      qrBtn: 'QR'
    }
  };

  const applyLang = (lang) => {
    const t = i18n[lang];
    isEN = (lang === 'en');
    document.title = t.title;
    editor.placeholder = t.placeholder;
    btnPack.title = t.packTitle;
    btnUnpack.title = t.unpackTitle;
    btnQr.textContent = t.qrBtn;
    langBtn.textContent = isEN ? '𝓅𝓎' : '𝓁𝓃';
    
    fontMenu.querySelectorAll('button').forEach(b => {
      const f = FONTS.find(x => x.stack === b.dataset.stack);
      if (f) b.textContent = isEN ? f.enName : f.name;
    });
    setModalStatus('');
    infoText.textContent = t.infoText;
    donateText.textContent = t.donateText;
  };

  langBtn.addEventListener('click', () => {
    applyLang(isEN ? 'ru' : 'en');
  });

  const FONT_KEY = 'pack-font-2';
  let currentFont = FONTS[0].stack;
  try {
    const saved = localStorage.getItem(FONT_KEY);
    if (saved) { const f = FONTS.find(x => x.stack === saved); if (f) currentFont = f.stack; }
  } catch {}

  const applyFont = (stack) => {
    currentFont = stack;
    editor.style.fontFamily = stack;
    try { localStorage.setItem(FONT_KEY, stack); } catch {}
    fontMenu.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.stack === stack));
  };

  FONTS.forEach(f => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.stack = f.stack;
    b.style.fontFamily = f.stack;
    b.textContent = f.name;
    if (f.stack === currentFont) b.classList.add('active');
    b.addEventListener('click', (e) => { e.stopPropagation(); applyFont(f.stack); closeMenu(); });
    fontMenu.appendChild(b);
  });
  applyFont(currentFont);

  const openMenu = () => { fontMenu.classList.add('open'); fontwrap.classList.add('open'); };
  const closeMenu = () => { fontMenu.classList.remove('open'); fontwrap.classList.remove('open'); };
  const toggleMenu = () => { if (fontMenu.classList.contains('open')) closeMenu(); else openMenu(); };

  fontGlyph.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
  document.addEventListener('click', (e) => { if (!fontwrap.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

  const THEME_KEY = 'pack-theme';
  try {
    const t = localStorage.getItem(THEME_KEY);
    if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
  } catch {}

  const systemDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
  const currentTheme = () => {
    const t = root.getAttribute('data-theme');
    if (t === 'light' || t === 'dark') return t;
    return systemDark() ? 'dark' : 'light';
  };

  view.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch {}
  });

  const SIZE_KEY = 'pack-size';
  let fontSize = 21;
  try {
    const v = parseInt(localStorage.getItem(SIZE_KEY) || '', 10);
    if (v >= 14 && v <= 38) fontSize = v;
  } catch {}
  const applySize = () => {
    editor.style.fontSize = fontSize + 'px';
    try { localStorage.setItem(SIZE_KEY, String(fontSize)); } catch {}
  };
  applySize();
  $('dec').addEventListener('click', () => { if (fontSize > 14) { fontSize -= 2; applySize(); } });
  $('inc').addEventListener('click', () => { if (fontSize < 38) { fontSize += 2; applySize(); } });

  const grow = () => {
    editor.style.height = 'auto';
    const min = Math.max(window.innerHeight * 0.3, 200);
    editor.style.height = Math.max(editor.scrollHeight, min) + 'px';
  };
  editor.addEventListener('input', grow);
  window.addEventListener('resize', grow);
  grow();

  const setModalStatus = (msg, kind) => {
    modalStatus.textContent = msg || '';
    modalStatus.className = 'modal-status' + (kind ? ' ' + kind : '');
  };

  const openModal = () => {
    overlay.classList.add('open');
    setModalStatus('');
    pwInput.value = '';
    setTimeout(() => pwInput.focus(), 50);
  };
  const closeModal = () => overlay.classList.remove('open');

  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
  });

  const lockBtns = (on) => { btnPack.disabled = on; btnUnpack.disabled = on; };

  const setHash = (hash) => {
    try { history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search); } catch {}
  };

  const extractHash = (input) => {
    let s = String(input || '').trim();
    if (!s) return '';
    const i = s.indexOf('#');
    if (i >= 0) s = s.slice(i + 1);
    try { s = decodeURIComponent(s); } catch {}
    return s;
  };

  const drawQR = (text) => {
    try {
      const matrix = getQRMatrix(text);
      const count = matrix.length;
      
      const displaySize = Math.min(window.innerWidth * 0.8, window.innerHeight * 0.8, 600);
      const cellSize = Math.floor(displaySize / count);
      const size = count * cellSize;

      qrCanvas.width = size;
      qrCanvas.height = size;
      
      qrCanvas.style.width = size + 'px';
      qrCanvas.style.height = size + 'px';

      const ctx = qrCanvas.getContext('2d');

      const isDark = currentTheme() === 'dark';
      const fgColor = isDark ? '#14120f' : '#d8cfc1'; 
      const bgColor = isDark ? '#d8cfc1' : '#14120f'; 

      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = fgColor;
      
      for (let row = 0; row < count; row++) {
        for (let col = 0; col < count; col++) {
          if (matrix[row][col]) {
            ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
          }
        }
      }
    } catch (e) {
      console.error(e);
    }
  };

  const closeQr = () => qrModal.classList.remove('open');
  qrModal.addEventListener('click', (e) => {
    if (e.target === qrModal) closeQr();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && qrModal.classList.contains('open')) closeQr();
  });

  btnQr.addEventListener('click', () => {
    btnQr.classList.toggle('active');
  });

  helpBtn.addEventListener('click', () => {
    infoModal.classList.add('open');
  });
  infoModal.addEventListener('mousedown', (e) => { if (e.target === infoModal) infoModal.classList.remove('open'); });

  $('donate').addEventListener('click', () => {
    donateModal.classList.add('open');
  });
  donateModal.addEventListener('mousedown', (e) => { if (e.target === donateModal) donateModal.classList.remove('open'); });

  const doPack = async () => {
    const text = editor.value;
    const pw = pwInput.value;
    const t = i18n[isEN ? 'en' : 'ru'];
    if (!text) { setModalStatus(t.errEmpty, 'err'); return; }
    if (pw.length !== 10) { setModalStatus(t.errLen, 'err'); return; }
    
    lockBtns(true);
    setModalStatus('…');
    try {
      const hash = await ep(text, pw);
      if (!hash) { setModalStatus(t.errError, 'err'); return; }
      if (hash.length > HASH_LIMIT) {
        setModalStatus(t.errLong, 'err');
        return;
      }
    
      if (btnQr.classList.contains('active')) {
        const futureUrl = location.origin + location.pathname + '#' + hash;
        drawQR(futureUrl);
        qrModal.classList.add('open');
        btnQr.classList.remove('active'); 
        closeModal();
      } else {
        closeModal();
      }

      editor.value = hash;
      setHash(hash);
      grow();
      
    } catch { setModalStatus(t.errError, 'err'); }
    finally { lockBtns(false); }
  };

  const doUnpack = async () => {
    const raw = extractHash(editor.value);
    const pw = pwInput.value;
    const t = i18n[isEN ? 'en' : 'ru'];
    if (!raw) { setModalStatus(t.errEmpty, 'err'); return; }
    if (pw.length !== 10) { setModalStatus(t.errLen, 'err'); return; }
    lockBtns(true);
    setModalStatus('…');
    try {
      const text = await dp(raw, pw);
      if (text === null || text === '') {
        setModalStatus(t.errFail, 'err');
        return;
      }
      editor.value = text;
      setHash('');
      grow();
      closeModal();
    } catch { setModalStatus(t.errError, 'err'); }
    finally { lockBtns(false); }
  };

  btnPack.addEventListener('click', doPack);
  btnUnpack.addEventListener('click', doUnpack);
  pwInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doPack(); }
  });

  $('go').addEventListener('click', openModal);

  if (location.hash && location.hash.length > 1) {
    const fromHash = extractHash(location.hash);
    if (fromHash) { editor.value = fromHash; setHash(fromHash); grow(); }
  }

  applyLang('ru');

  downloadBtn.addEventListener('click', () => {
    const html = '<!doctype html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'T.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    toastEl.textContent = i18n[isEN ? 'en' : 'ru'].msgSaved;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 4000);
  });

})();
</script>
</body>
</html>
