      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">

<title>T</title>
<style>
  :root{
    --bg:#f6f1e7;
    --bg-2:#fbf7ee;
    --text:#2b2620;
    --muted:#8a8172;
    --line:#e2d9c6;
    --panel:#fbf7ee;
    --accent:#2b2620;
    --overlay:rgba(43,38,32,.4);
    --shadow:0 20px 44px -20px rgba(60,45,20,.28);
  }
  [data-theme="dark"]{
    --bg:#14120f;
    --bg-2:#181510;
    --text:#d8cfc1;
    --muted:#8a8074;
    --line:#2a2620;
    --panel:#1b1813;
    --accent:#d8cfc1;
    --overlay:rgba(0,0,0,.7);
    --shadow:0 22px 50px -22px rgba(0,0,0,.75);
  }
  @media (prefers-color-scheme: dark){
    [data-theme="auto"]{
      --bg:#14120f;
      --bg-2:#181510;
      --text:#d8cfc1;
      --muted:#8a8074;
      --line:#2a2620;
      --panel:#1b1813;
      --accent:#d8cfc1;
      --overlay:rgba(0,0,0,.7);
      --shadow:0 22px 50px -22px rgba(0,0,0,.75);
    }
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 50% -10%, var(--bg-2), transparent 60%),
      var(--bg);
    background-repeat:no-repeat;
    background-size:cover;
    color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
    transition:background-color .3s ease, color .3s ease;
    overscroll-behavior-y:none;
  }
  body.modal-open { overflow: hidden; }
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:46px 30px 24px;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .bar{
    display:flex; align-items:center; justify-content:space-between;
    gap:24px; margin-bottom:36px;
    font-size:15px; color:var(--muted);
    user-select:none;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:30;
    flex:0 0 auto;
  }
  .bar-left { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .bar-right { display:flex; align-items:center; gap:20px; flex-wrap:wrap; justify-content:flex-end; }
  .sizer{ display:flex; align-items:center; gap:2px; }
  .sizer button{
    appearance:none; border:0; background:transparent;
    color:var(--muted);
    font-family:monospace;
    font-size:24px; line-height:1;
    width:28px; height:30px;
    display:grid; place-items:center;
    padding:0; cursor:default;
    transition:color .2s;
  }
  .sizer button:focus{outline:none}
  .text-btn{
    appearance:none; border:0; background:transparent;
    color:var(--muted);
    font-family:monospace !important;
    font-size:15px; line-height:1;
    padding:0; cursor:default;
    transition:color .2s;
  }
  .text-btn:focus{outline:none}
  .text-btn:hover{ color:var(--text); }
  
  .fontwrap{ position:relative; display:inline-flex; align-items:center; }
  .menuwrap{ position:relative; display:inline-flex; align-items:center; }
  .fontmenu{
    position:absolute; top:calc(100% + 12px); left:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:6px;
    display:none;
    z-index:100;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:nowrap;
    width:max-content;
  }
  .menuwrap .fontmenu { left:auto; right:0; }
  .fontmenu.open{display:block}
  .fontmenu button{
    display:flex; align-items:baseline; justify-content:flex-start;
    width:100%;
    appearance:none; border:0; background:transparent;
    color:var(--text); font:inherit; font-size:15px;
    padding:8px 12px;
    border-radius:6px;
    cursor:default;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
  }
  .fontmenu button.active{color:var(--accent); font-weight:700}

  .editor-container {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
  }
  .editor{
    width:100%;
    border:0; outline:none; resize:none;
    background:transparent; color:var(--text);
    font:inherit; line-height:1.75;
    padding:0;
    letter-spacing:.005em;
    overflow:hidden;
    position:relative;
    z-index:1;
    min-height:1.75em;
  }
  .editor::placeholder{color:var(--muted); font-style:italic; opacity:.7}
  
  .copy-btn {
    position: absolute;
    top: 0;
    right: -32px;
    background: transparent;
    border: 0;
    padding: 4px;
    color: var(--muted);
    cursor: default;
    transition: color 0.2s;
    display: grid;
    place-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  .copy-btn svg {
    width: 1.1em;
    height: 1.1em;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }
  .copy-btn:hover, .copy-btn:focus {
    color: var(--text);
    outline: none;
  }

  .overlay{
    position:fixed; inset:0; background:var(--overlay);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:50;
    backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex}
  .modal{
    position:relative;
    background:var(--panel); color:var(--text);
    border-radius:12px; padding:34px 28px 26px;
    width:100%; max-width:420px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    font-family:Georgia,"Times New Roman",serif;
  }
  .passrow{
    display:grid;
    grid-template-columns:60px 1fr auto;
    gap:10px; align-items:stretch;
  }
  .passrow .pw{
    width:100%; padding:14px 16px; font-size:18px;
    background:transparent; color:inherit;
    border:1px solid var(--line); border-radius:8px; outline:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.22em; text-align:center;
    -webkit-text-security:disc;
  }
  .passrow .pw:focus{border-color:var(--text)}
  .passrow .pw::placeholder{color:var(--muted); letter-spacing:normal; font-family:inherit; font-size:14px}
  .passrow .act{
    appearance:none; cursor:default; font:inherit; font-size:20px; font-weight:700;
    border:1px solid var(--line); background:transparent; color:var(--text);
    border-radius:8px;
    -webkit-tap-highlight-color:transparent;
    padding:0 12px;
  }
  .passrow .act:hover{border-color:var(--text)}
  .passrow .act[disabled]{opacity:.4}
  .passrow .act.pack{background:var(--accent); color:var(--bg); border-color:var(--accent)}
  .passrow .act.pack:hover{opacity:.85}
  .modal-status{
    margin-top:16px; font-size:13px; color:var(--muted); min-height:18px;
    text-align:center;
  }
  .modal-status.err{color:#a8442f}
  .modal-status.ok{color:#4a7a3a}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    padding:12px 20px; border-radius:8px; box-shadow:var(--shadow);
    font-size:14px; opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease; z-index:100;
    text-align:center; line-height:1.4; max-width:80%;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #infoModal .modal, #donateModal .modal{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    padding:40px 28px 28px;
    text-align:left;
    max-height:90vh;
  }
  .info-text{
    font-size:15px;
    line-height:1.6;
    margin:0;
    color:var(--text);
    text-align:left;
    width:100%;
    word-break:break-word;
    overflow-wrap:break-word;
    overflow-y:auto;
    padding-right:8px;
    max-height:65vh;
    scrollbar-width:none;
  }
  .info-text::-webkit-scrollbar{ display:none; }
  
  @media (max-width: 600px) {
    .bar {
      flex-direction: column;
      align-items: flex-start;
      gap: 15px;
    }
    .bar-right {
      order: -1;
      width: 100%;
      justify-content: space-between;
    }
    .bar-left {
      width: 100%;
      justify-content: space-between;
    }
    .copy-btn {
      right: 0;
      top: -32px;
    }
    .passrow {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "pw pw"
        "unpack pack";
      gap: 10px;
    }
    .passrow .pw { grid-area: pw; }
    #btnUnpack { grid-area: unpack; }
    #btnPack { grid-area: pack; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="bar-left">
      <button class="text-btn" id="dec" aria-label="Меньше">−</button>
      <div class="fontwrap" id="fontwrap">
        <button class="text-btn" id="fontToggle">Шрифт</button>
        <div class="fontmenu" id="fontMenu" role="menu" aria-label="Шрифт"></div>
      </div>
      <button class="text-btn" id="inc" aria-label="Больше">+</button>
    </div>
    <div class="bar-right">
      <button class="text-btn" id="go"><span id="goLabel">#Применить</span></button>
      <div class="menuwrap" id="menuwrap">
        <button class="text-btn" id="menuToggle">Сюда</button>
        <div class="fontmenu" id="mainMenu" role="menu" aria-label="Меню">
          <button type="button" data-action="theme">Тема</button>
          <button type="button" data-action="download">Офлайн</button>
          <button type="button" data-action="donate">Биток</button>
          <button type="button" data-action="info">Инфо</button>
        </div>
      </div>
      <button class="text-btn lang" id="lang">Eng</button>
    </div>
  </div>

  <div class="editor-container">
    <textarea class="editor" id="editor" rows="1" placeholder="Ввод..." spellcheck="false"></textarea>
    <button class="copy-btn" id="copyBtn" aria-label="Копировать">
      <svg viewBox="0 0 24 24">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
    </button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="passrow">
      <button class="act" id="btnUnpack">↶</button>
      <input class="pw" id="pw" type="text" maxlength="10" placeholder="••••••••••" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="nope-please-ignore" aria-label="Поле">
      <button class="act pack" id="btnPack">→</button>
    </div>
    <div class="modal-status" id="modalStatus" aria-live="polite"></div>
  </div>
</div>

<div class="overlay" id="infoModal">
  <div class="modal" role="dialog" aria-modal="true">
    <p class="info-text" id="infoText"></p>
  </div>
</div>

<div class="overlay" id="donateModal">
  <div class="modal" role="dialog" aria-modal="true">
    <p class="info-text" id="donateText"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const NAMES = [

    "Faya","Zina","Liza","Mila","Ulya","Yulia","Oksana","Alina","Vlada",

    "Sofia","Kira","Vasilisa","Ulyana","Anastasia","Valeria","Kristina","Viktoria","Ekaterina","Evgenia",
    "Lyubov","Nadezhda","Lyudmila","Svetlana","Tatyana","Galina","Valentina","Raisa","Zinaida",
    "Tamara","Alla","Emma","Elza","Ada","Liya","Lola","Nell",
    "Nora","Roza","Ruta","Sara","Faina","Flora","Elvira","Yuna",
    "Alena","Angelina","Anzhelika","Ariadna","Arina",
    "Bella","Berta","Bogdana","Vanda","Varvara","Veronika",
    "Violetta","Vita","Vladislava","Gella","Diana",
    "Evdokiya","Elmira","Emiliya",
    "Erika","Esfir","Zhanna","Zarina","Zulfiya","Inessa",
    "Iraida","Iya","Kapitolina","Karina","Klavdiya"
  ];

  const MAX_URL_LEN = 5000;
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  const L = (() => { const m = Object.create(null); for (let i = 0; i < A.length; i++) m[A[i]] = i; return m; })();
  const HAS_CS = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';

  const NAME_INDEX = new Map();
  for (let i = 0; i < 256; i++) NAME_INDEX.set(NAMES[i], i);

  const te = new TextEncoder();
  const td = new TextDecoder();

  const wf = (v) => {
    const s = String(v ?? '');
    if (typeof s.toWellFormed === 'function') return s.toWellFormed();
    let o = '';
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c >= 0xd800 && c <= 0xdbff) {
        const n = s.charCodeAt(i + 1);
        if (n >= 0xdc00 && n <= 0xdfff) { o += s[i] + s[i + 1]; i++; }
        else o += '\uFFFD';
      } else if (c >= 0xdc00 && c <= 0xdfff) o += '\uFFFD';
      else o += s[i];
    }
    return o;
  };

  const zc = (input) => {
    const s = wf(input);
    if (!s) return '';
    const d = Object.create(null);
    const tc = Object.create(null);
    let ds = 3, nb = 2, ei = 2, w = '';
    const st = { out: [], v: 0, p: 0 };
    const em = (bit) => {
      st.v = (st.v << 1) | bit;
      if (st.p === 5) { st.out.push(A[st.v]); st.v = 0; st.p = 0; }
      else st.p++;
    };
    const fl = () => {
      if (w in tc) {
        if (w.charCodeAt(0) < 256) {
          for (let k = 0; k < nb; k++) em(0);
          let v = w.charCodeAt(0);
          for (let k = 0; k < 8; k++) { em(v & 1); v >>= 1; }
        } else {
          let v = 1;
          for (let k = 0; k < nb; k++) { em(v & 1); v >>= 1; }
          let vv = w.charCodeAt(0);
          for (let k = 0; k < 16; k++) { em(vv & 1); vv >>= 1; }
        }
        ei--;
        if (ei === 0) { ei = 2 ** nb; nb++; }
        delete tc[w];
      } else {
        let v = d[w];
        for (let k = 0; k < nb; k++) { em(v & 1); v >>= 1; }
      }
      ei--;
      if (ei === 0) { ei = 2 ** nb; nb++; }
    };
    for (let i = 0; i < s.length; i++) {
      const c = s.charAt(i);
      if (!(c in d)) { d[c] = ds++; tc[c] = true; }
      const wc = w + c;
      if (wc in d) { w = wc; continue; }
      fl();
      d[wc] = ds++;
      w = String(c);
    }
    if (w !== '') fl();
    let v = 2;
    for (let k = 0; k < nb; k++) { em(v & 1); v >>= 1; }
    while (true) {
      st.v <<= 1;
      if (st.p === 5) { st.out.push(A[st.v]); break; }
      st.p++;
    }
    return st.out.join('');
  };

  const rb = (n, data, len, get) => {
    let bits = 0, power = 1;
    const max = 2 ** n;
    while (power !== max) {
      const resb = data.val & data.pos;
      data.pos >>= 1;
      if (data.pos === 0) {
        data.pos = 32;
        if (data.i < len) data.val = get(data.i);
        data.i++;
      }
      bits |= (resb > 0 ? 1 : 0) * power;
      power <<= 1;
    }
    return bits;
  };

  const zd = (input) => {
    if (input == null) return null;
    if (input === '') return '';
    const get = (i) => L[input.charAt(i)];
    const data = { val: get(0), pos: 32, i: 1 };
    if (data.val == null) return null;
    const d = [0, 1, 2];
    let ei = 4, ds = 4, nb = 3, en = '';
    const res = [];
    const next = rb(2, data, input.length, get);
    let c;
    if (next === 0) c = String.fromCharCode(rb(8, data, input.length, get));
    else if (next === 1) c = String.fromCharCode(rb(16, data, input.length, get));
    else if (next === 2) return '';
    else return null;
    d[3] = c;
    let w = c;
    res.push(c);
    while (true) {
      if (data.i > input.length) return null;
      let bits = rb(nb, data, input.length, get);
      if (bits === 0) {
        d[ds] = String.fromCharCode(rb(8, data, input.length, get));
        bits = ds++; ei--;
      } else if (bits === 1) {
        d[ds] = String.fromCharCode(rb(16, data, input.length, get));
        bits = ds++; ei--;
      } else if (bits === 2) {
        return res.join('');
      }
      if (ei === 0) { ei = 2 ** nb; nb++; }
      if (d[bits] !== undefined) en = d[bits];
      else if (bits === ds) en = w + w.charAt(0);
      else return null;
      res.push(en);
      d[ds++] = w + en.charAt(0);
      ei--; w = en;
      if (ei === 0) { ei = 2 ** nb; nb++; }
    }
  };

  const compress = async (text) => {
    if (HAS_CS) {
      const stream = new CompressionStream('deflate');
      const writer = stream.writable.getWriter();
      writer.write(te.encode(text));
      writer.close();
      const response = new Response(stream.readable);
      const buf = await response.arrayBuffer();
      return new Uint8Array(buf);
    }
    return te.encode(zc(text));
  };

  const decompress = async (buf) => {
    if (HAS_CS) {
      const stream = new DecompressionStream('deflate');
      const writer = stream.writable.getWriter();
      writer.write(buf);
      writer.close();
      const response = new Response(stream.readable);
      return await response.text();
    }
    return zd(td.decode(buf));
  };

  const dk = async (pw, salt) => {
    const km = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  };

  const ep = async (text, pw) => {
    const z = await compress(text);
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await dk(pw, salt);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, z));
    const out = new Uint8Array(1 + 16 + 12 + ct.length);
    out[0] = HAS_CS ? 1 : 2;
    out.set(salt, 1);
    out.set(iv, 17);
    out.set(ct, 29);
    return out;
  };

  const dp = async (raw, pw) => {
    try {
      if (raw.length < 1 + 16 + 12 + 16) return null;
      if (raw[0] !== 1 && raw[0] !== 2) return null;
      const salt = raw.slice(1, 17);
      const iv = raw.slice(17, 29);
      const ct = raw.slice(29);
      const key = await dk(pw, salt);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
      return await decompress(new Uint8Array(pt));
    } catch { return null; }
  };

  const bytesToNames = (bytes) => {
    const parts = [];
    for (let i = 0; i < bytes.length; i++) parts.push(NAMES[bytes[i]]);
    return parts.join('-');
  };

  const namesToBytes = (str) => {
    const parts = str.split('-');
    const bytes = new Uint8Array(parts.length);
    for (let i = 0; i < parts.length; i++) {
      const idx = NAME_INDEX.get(parts[i]);
      if (idx === undefined) return null;
      bytes[i] = idx;
    }
    return bytes;
  };

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const editor = $('editor');
  const overlay = $('overlay');
  const pwInput = $('pw');
  const modalStatus = $('modalStatus');
  const btnPack = $('btnPack');
  const btnUnpack = $('btnUnpack');
  const fontwrap = $('fontwrap');
  const fontMenu = $('fontMenu');
  const fontToggle = $('fontToggle');
  const menuwrap = $('menuwrap');
  const mainMenu = $('mainMenu');
  const menuToggle = $('menuToggle');
  const langBtn = $('lang');
  const toastEl = $('toast');
  const infoModal = $('infoModal');
  const donateModal = $('donateModal');
  const donateText = $('donateText');
  const infoText = $('infoText');
  const convertBtn = $('go');
  const goLabel = $('goLabel');
  const copyBtn = $('copyBtn');

  const FONTS = [
    { name: 'Временной',       enName: 'Times',        stack: "'Times New Roman', Times, serif" },
    { name: 'Антенный',        enName: 'Arial',        stack: "Arial, Helvetica, sans-serif" },
    { name: 'Грузинский',      enName: 'Georgia',      stack: "Georgia, 'Times New Roman', serif" },
    { name: 'Старокнижный',    enName: 'Antiqua',      stack: "'Book Antiqua', Palatino, serif" },
    { name: 'Баскервильский',  enName: 'Baskerville',  stack: "'Baskerville', 'Libre Baskerville', Georgia, serif" },
    { name: 'Швейцарский',     enName: 'Helvetica',    stack: "'Helvetica Neue', Helvetica, Arial, sans-serif" },
    { name: 'Курьерский',      enName: 'Courier',      stack: "'Courier New', Courier, monospace" },
    { name: 'Моноширинный',    enName: 'Monospace',    stack: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" },
    { name: 'Верданский',      enName: 'Verdana',      stack: "'Verdana', Geneva, sans-serif" }
  ];

  let isEN = false;

  const i18n = {
    ru: {
      title: 'Текстиньо. Текст в ссылке',
      placeholder: 'Ввод...',
      packTitle: 'Упаковать',
      unpackTitle: 'Распаковать',
      errEmpty: 'Пусто',
      errLen: '10 символов',
      errLong: 'Ссылка слишком длинная, пересылайте текстом',
      errFail: 'Нет',
      errError: 'Ошибка',
      msgSaved: 'Офлайнутся',
      copied: 'Скопировано',
      copyError: 'Ошибка',
      menuLabel: 'Сюда',
      theme: 'Тема',
      offline: 'Офлайн',
      bitcoin: 'Биток',
      info: 'Инфо',
      hashBtn: '#Применить',
      hashAria: 'Применить',
      copyAria: 'Копировать',
      infoText: '?',
      donateText: 'bc1qqx8qn6jd6jn7vstjp86n990thzlkmvauu2wyha'
    },
    en: {
      title: 'Textinho. Text in the link',
      placeholder: 'Input...',
      packTitle: 'Pack',
      unpackTitle: 'Unpack',
      errEmpty: 'Empty',
      errLen: '10 characters',
      errLong: 'Link too long, send as text',
      errFail: 'None',
      errError: 'Error',
      msgSaved: 'Use offline',
      copied: 'Copied',
      copyError: 'Error',
      menuLabel: 'Here',
      theme: 'Theme',
      offline: 'Offline',
      bitcoin: 'Bitcoin',
      info: 'Info',
      hashBtn: '#Apply',
      hashAria: 'Apply',
      copyAria: 'Copy',
      infoText: '?',
      donateText: 'bc1qqx8qn6jd6jn7vstjp86n990thzlkmvauu2wyha'
    }
  };

  const setModalStatus = (msg, kind) => {
    modalStatus.textContent = msg || '';
    modalStatus.className = 'modal-status' + (kind ? ' ' + kind : '');
  };

  let toastTimer;
  const showToast = (msg, duration = 3000) => {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  };

  const showModal = (el) => {
    el.classList.add('open');
    document.body.classList.add('modal-open');
  };

  const hideModal = (el) => {
    el.classList.remove('open');
    document.body.classList.remove('modal-open');
  };

  const applyLang = (lang) => {
    const t = i18n[lang];
    isEN = (lang === 'en');
    document.title = t.title;
    editor.placeholder = t.placeholder;
    btnPack.title = t.packTitle;
    btnUnpack.title = t.unpackTitle;
    goLabel.textContent = t.hashBtn;
    convertBtn.setAttribute('aria-label', t.hashAria);
    copyBtn.setAttribute('aria-label', t.copyAria);
    menuToggle.textContent = t.menuLabel;
    mainMenu.querySelector('[data-action="theme"]').textContent = t.theme;
    mainMenu.querySelector('[data-action="download"]').textContent = t.offline;
    mainMenu.querySelector('[data-action="donate"]').textContent = t.bitcoin;
    mainMenu.querySelector('[data-action="info"]').textContent = t.info;
    fontToggle.textContent = isEN ? 'Font' : 'Шрифт';
    langBtn.textContent = isEN ? 'Русский' : 'Eng';
    fontMenu.querySelectorAll('button').forEach(b => {
      const f = FONTS.find(x => x.stack === b.dataset.stack);
      if (f) b.textContent = isEN ? f.enName : f.name;
    });
    setModalStatus('');
    infoText.textContent = t.infoText;
    donateText.textContent = t.donateText;
  };

  langBtn.addEventListener('click', () => applyLang(isEN ? 'ru' : 'en'));

  const FONT_KEY = 'pack-font-2';
  let currentFont = FONTS[0].stack;
  try {
    const saved = localStorage.getItem(FONT_KEY);
    if (saved) { const f = FONTS.find(x => x.stack === saved); if (f) currentFont = f.stack; }
  } catch {}

  const applyFont = (stack) => {
    currentFont = stack;
    editor.style.fontFamily = stack;
    try { localStorage.setItem(FONT_KEY, stack); } catch {}
    fontMenu.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.stack === stack));
  };

  const makeDropdown = (wrap, toggle, menu) => {
    const close = () => menu.classList.remove('open');
    const open = () => menu.classList.add('open');
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (menu.classList.contains('open')) close(); else open();
    });
    document.addEventListener('click', (e) => {
      if (!wrap.contains(e.target)) close();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
    });
    return { open, close };
  };

  const fontDD = makeDropdown(fontwrap, fontToggle, fontMenu);
  const mainDD = makeDropdown(menuwrap, menuToggle, mainMenu);

  FONTS.forEach(f => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.stack = f.stack;
    b.style.fontFamily = f.stack;
    b.textContent = f.name;
    if (f.stack === currentFont) b.classList.add('active');
    b.addEventListener('click', (e) => { e.stopPropagation(); applyFont(f.stack); fontDD.close(); });
    fontMenu.appendChild(b);
  });
  applyFont(currentFont);

  const THEME_KEY = 'pack-theme';
  try {
    const t = localStorage.getItem(THEME_KEY);
    if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
  } catch {}

  const systemDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
  const currentTheme = () => {
    const t = root.getAttribute('data-theme');
    if (t === 'light' || t === 'dark') return t;
    return systemDark() ? 'dark' : 'light';
  };
  const applyTheme = (t) => {
    root.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch {}
  };
  const toggleTheme = () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');

  const SIZE_KEY = 'pack-size';
  let fontSize = 21;
  try {
    const v = parseInt(localStorage.getItem(SIZE_KEY) || '', 10);
    if (v >= 14 && v <= 38) fontSize = v;
  } catch {}
  const applySize = () => {
    editor.style.fontSize = fontSize + 'px';
    try { localStorage.setItem(SIZE_KEY, String(fontSize)); } catch {}
  };
  applySize();
  $('dec').addEventListener('click', () => { if (fontSize > 14) { fontSize -= 2; applySize(); } });
  $('inc').addEventListener('click', () => { if (fontSize < 38) { fontSize += 2; applySize(); } });

  let growScheduled = false;
  const grow = () => {
    if (growScheduled) return;
    growScheduled = true;
    requestAnimationFrame(() => {
      growScheduled = false;
      const current = editor.offsetHeight;
      const needed = editor.scrollHeight;
      if (needed !== current) {
        editor.style.height = needed + 'px';
      }
    });
  };
  editor.addEventListener('input', grow);
  window.addEventListener('resize', grow);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(grow).observe(editor);
  }
  grow();

  const lockBtns = (on) => { btnPack.disabled = on; btnUnpack.disabled = on; };

  const setHash = (hash) => {
    try { history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search); } catch {}
  };

  const extractHash = (input) => {
    let s = String(input || '').trim();
    if (!s) return '';
    const i = s.indexOf('#');
    if (i >= 0) s = s.slice(i + 1);
    try { s = decodeURIComponent(s); } catch {}
    return s;
  };

  const openModal = () => {
    showModal(overlay);
    setModalStatus('');
    pwInput.value = '';
    setTimeout(() => pwInput.focus(), 50);
  };
  const closeModal = () => hideModal(overlay);

  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeModal(); });
  infoModal.addEventListener('mousedown', (e) => { if (e.target === infoModal) hideModal(infoModal); });
  donateModal.addEventListener('mousedown', (e) => { if (e.target === donateModal) hideModal(donateModal); });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    [overlay, infoModal, donateModal].forEach(m => {
      if (m.classList.contains('open')) hideModal(m);
    });
  });

  const downloadOffline = () => {
    const html = '<!doctype html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'TEXTINHO.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(i18n[isEN ? 'en' : 'ru'].msgSaved, 4000);
  };

  mainMenu.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      mainDD.close();
      const action = b.dataset.action;
      if (action === 'theme') toggleTheme();
      else if (action === 'download') downloadOffline();
      else if (action === 'donate') showModal(donateModal);
      else if (action === 'info') showModal(infoModal);
    });
  });

  const doPack = async () => {
    const text = editor.value;
    const pw = pwInput.value;
    const t = i18n[isEN ? 'en' : 'ru'];
    if (!text) { setModalStatus(t.errEmpty, 'err'); return; }
    if (pw.length !== 10) { setModalStatus(t.errLen, 'err'); return; }

    lockBtns(true);
    setModalStatus('…');
    try {
      const rawHash = await ep(text, pw);
      if (!rawHash) { setModalStatus(t.errError, 'err'); return; }
      const namesHash = bytesToNames(rawHash);
      editor.value = namesHash;
      grow();
      closeModal();
      if (namesHash.length > MAX_URL_LEN) {
        setHash('');
        setTimeout(() => showToast(t.errLong, 4000), 100);
      } else {
        setHash(namesHash);
      }
    } catch {
      setModalStatus(t.errError, 'err');
    } finally { lockBtns(false); }
  };

  const doUnpack = async () => {
    const raw = extractHash(editor.value);
    const pw = pwInput.value;
    const t = i18n[isEN ? 'en' : 'ru'];
    if (!raw) { setModalStatus(t.errEmpty, 'err'); return; }
    if (pw.length !== 10) { setModalStatus(t.errLen, 'err'); return; }
    lockBtns(true);
    setModalStatus('…');
    try {
      const bytes = namesToBytes(raw);
      if (!bytes) { setModalStatus(t.errFail, 'err'); return; }
      const text = await dp(bytes, pw);
      if (text === null || text === '') { setModalStatus(t.errFail, 'err'); return; }
      editor.value = text;
      setHash('');
      grow();
      closeModal();
    } catch { setModalStatus(t.errError, 'err'); }
    finally { lockBtns(false); }
  };

  btnPack.addEventListener('click', doPack);
  btnUnpack.addEventListener('click', doUnpack);
  pwInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doPack(); }
  });

  convertBtn.addEventListener('click', openModal);

  copyBtn.addEventListener('click', async () => {
    const text = editor.value;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      showToast(i18n[isEN ? 'en' : 'ru'].copied, 2000);
    } catch {
      showToast(i18n[isEN ? 'en' : 'ru'].copyError, 2000);
    }
  });

  if (location.hash && location.hash.length > 1) {
    const fromHash = extractHash(location.hash);
    if (fromHash) { editor.value = fromHash; setHash(fromHash); grow(); }
  }

  applyLang('ru');

})();
</script>
</body>
</html>
