<!doctype html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="description" content="Текст в ссылке/Text in the link">
<meta property="og:description" content="Текст в ссылке/Text in the link">
<meta name="robots" content="noindex, nofollow">

<title>T</title>
<style>
  :root{
    --bg:#f6f1e7;
    --bg-2:#fbf7ee;
    --text:#2b2620;
    --muted:#8a8172;
    --line:#e2d9c6;
    --panel:#fbf7ee;
    --accent:#2b2620;
    --overlay:rgba(43,38,32,.4);
    --shadow:0 20px 44px -20px rgba(60,45,20,.28);
    --dot:#ffffff;
    --dot-bg:#f0eadb;
  }
  [data-theme="dark"]{
    --bg:#14120f;
    --bg-2:#181510;
    --text:#d8cfc1;
    --muted:#8a8074;
    --line:#2a2620;
    --panel:#1b1813;
    --accent:#d8cfc1;
    --overlay:rgba(0,0,0,.7);
    --shadow:0 22px 50px -22px rgba(0,0,0,.75);
    --dot:#3a352d;
    --dot-bg:#1a1712;
  }
  @media (prefers-color-scheme: dark){
    [data-theme="auto"]{
      --bg:#14120f;
      --bg-2:#181510;
      --text:#d8cfc1;
      --muted:#8a8074;
      --line:#2a2620;
      --panel:#1b1813;
      --accent:#d8cfc1;
      --overlay:rgba(0,0,0,.7);
      --shadow:0 22px 50px -22px rgba(0,0,0,.75);
      --dot:#3a352d;
      --dot-bg:#1a1712;
    }
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 50% -10%, var(--bg-2), transparent 60%),
      var(--bg);
    background-repeat:no-repeat;
    background-size:cover;
    color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
    transition:background-color .3s ease, color .3s ease;
    overscroll-behavior-y:none;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:-100%;
    transform:rotate(270deg);
    transform-origin:center;
    background-color:var(--dot-bg);
    opacity:1;
    background-image:radial-gradient(var(--dot) 0.4px, var(--dot-bg) 0.4px);
    background-size:4px 4px;
    z-index:-1;
    pointer-events:none;
    transition:background-color .3s ease;
  }
  body.modal-open { overflow: hidden; }
  
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:46px 30px 24px;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  
  .bar{
    display:flex;
    align-items:center;
    margin-bottom:36px;
    font-size:15px;
    color:var(--muted);
    user-select:none;
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:30;
    flex:0 0 auto;
    padding-bottom:20px;
  }
  
  .bar-desktop{
    display:flex;
    align-items:center;
    gap:20px;
    width:100%;
  }
  .bar-desktop-right{
    display:flex;
    align-items:center;
    gap:20px;
    margin-left:auto;
  }
  .bar-mobile{ display:none; }
  
  .text-btn{
    appearance:none; 
    border:0 !important; 
    background:transparent !important;
    box-shadow:none !important;
    outline:none !important;
    color:var(--muted);
    font-family:monospace !important;
    font-size:15px; line-height:1;
    padding:0; cursor:default;
    transition:color .2s;
    display:inline-flex;
    align-items:center;
    -webkit-tap-highlight-color: transparent;
  }
  .text-btn:focus,
  .text-btn:active,
  .text-btn:hover { 
    outline: none !important; 
    box-shadow: none !important;
    border: 0 !important;
    background: transparent !important;
  }
  .text-btn::-moz-focus-inner { border: 0; }
  
  #dec, #inc{
    font-size:22px;
    width:22px;
    justify-content:center;
  }
  
  .fontwrap{ position:relative; display:inline-flex; align-items:center; }
  .menuwrap{ position:relative; display:inline-flex; align-items:center; }
  .fontmenu{
    position:absolute; top:calc(100% + 12px); left:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:6px;
    display:none;
    z-index:100;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:nowrap;
    width:max-content;
    max-width:calc(100vw - 24px);
  }
  .menuwrap .fontmenu { left:auto; right:0; }
  .fontmenu.open{display:block}
  .fontmenu button{
    display:flex; align-items:baseline; justify-content:flex-start;
    width:100%;
    appearance:none; border:0; background:transparent;
    color:var(--text); font:inherit; font-size:15px;
    padding:8px 12px;
    border-radius:6px;
    cursor:default;
    text-align:left;
    -webkit-tap-highlight-color:transparent;
  }
  .fontmenu button.active{color:var(--accent); font-weight:700}

  .editor{
    width:100%;
    border:0; outline:none; resize:none;
    background:transparent; color:var(--text);
    font:inherit; line-height:1.75;
    padding:0;
    letter-spacing:.005em;
    overflow:hidden;
    position:relative;
    z-index:1;
    min-height:1.75em;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .editor::-webkit-scrollbar { display: none; }
  .editor::placeholder{color:var(--muted); font-style:italic; opacity:.7}

  .overlay{
    position:fixed; inset:0; background:var(--overlay);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:50;
    backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex}
  .modal{
    position:relative;
    background:var(--panel); color:var(--text);
    border-radius:12px; padding:34px 28px 26px;
    width:100%; max-width:420px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    font-family:Georgia,"Times New Roman",serif;
  }
  .passrow{
    display:grid;
    grid-template-columns:60px 1fr auto;
    gap:10px; align-items:stretch;
  }
  .passrow .pw{
    width:100%; padding:14px 16px; font-size:18px;
    background:transparent; color:inherit;
    border:1px solid var(--line); border-radius:8px; outline:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.22em; text-align:center;
    -webkit-text-security:disc;
  }
  .passrow .pw:focus{border-color:var(--text)}
  .passrow .pw::placeholder{color:var(--muted); letter-spacing:normal; font-family:inherit; font-size:14px}
  .passrow .act{
    appearance:none; cursor:default; font:inherit; font-size:20px; font-weight:700;
    border:1px solid var(--line); background:transparent; color:var(--text);
    border-radius:8px;
    -webkit-tap-highlight-color:transparent;
    padding:0 12px;
    transition:border-color .2s;
  }
  .passrow .act[disabled]{opacity:.4}
  .passrow .act.pack{background:var(--accent); color:var(--bg); border-color:var(--accent)}
  .modal-status{
    margin-top:16px; font-size:13px; color:var(--muted); min-height:18px;
    text-align:center;
  }
  .modal-status.err{color:#a8442f}
  .modal-status.ok{color:#4a7a3a}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel); color:var(--text); border:1px solid var(--line);
    padding:12px 20px; border-radius:8px; box-shadow:var(--shadow);
    font-size:14px; opacity:0; pointer-events:none;
    transition:opacity .3s ease, transform .3s ease; z-index:100;
    text-align:center; line-height:1.4; max-width:80%;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #infoModal .modal, #donateModal .modal{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    padding:40px 28px 28px;
    text-align:left;
    max-height:90vh;
  }
  .info-text{
    font-size:15px;
    line-height:1.6;
    margin:0;
    color:var(--text);
    text-align:left;
    width:100%;
    word-break:break-word;
    overflow-wrap:break-word;
    overflow-y:auto;
    padding-right:8px;
    max-height:65vh;
    scrollbar-width:none;
  }
  .info-text::-webkit-scrollbar{ display:none; }

  .mode-row{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;
    color:var(--muted);
    user-select:none;
  }
  .mode-toggle{
    display:inline-flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:transparent;
  }
  .mode-toggle button{
    appearance:none;
    border:0;
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:13px;
    padding:7px 14px;
    cursor:default;
    transition:background-color .2s, color .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .mode-toggle button.active{
    background:var(--accent);
    color:var(--bg);
  }

  @media (max-width: 600px) {
    .bar-desktop{ display:none; }
    .bar-mobile{
      display:flex;
      align-items:center;
      justify-content:space-between;
      width:100%;
      gap:12px;
    }
    .bar-mobile-right{
      display:flex;
      align-items:center;
      gap:20px;
    }
    .passrow {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "pw pw"
        "unpack pack";
      gap: 10px;
    }
    .passrow .pw { grid-area: pw; }
    #btnUnpack { grid-area: unpack; }
    #btnPack { grid-area: pack; }
  }
</style>
</head>

  <div class="bar">

            <button type="button" data-action="donate">Биток</button>
            <button type="button" data-action="info">Инфо</button>
            <button type="button" data-action="clear">Чистка</button>
            <button type="button" data-action="copy-text">Копитекст</button>
            <button type="button" data-action="copy-link">Копилинк</button>
          </div>
        </div>
        <button class="text-btn" id="lang">Eng</button>
      </div>
    </div>
    <div class="bar-mobile">
      <button class="text-btn" id="goM"><span id="goLabelM">#Применить</span></button>
      <div class="bar-mobile-right">
        <button class="text-btn" id="langM">Eng</button>
        <div class="menuwrap" id="mobileMenuwrap">
          <button class="text-btn" id="mobileMenuToggle">Сюда</button>
          <div class="fontmenu" id="mobileMenu" role="menu" aria-label="Меню">
            <button type="button" data-action="theme">Тема</button>
            <button type="button" data-action="download">Офлайн</button>
            <button type="button" data-action="donate">Биток</button>
            <button type="button" data-action="info">Инфо</button>
            <button type="button" data-action="clear">Чистка</button>
            <button type="button" data-action="copy-text">Копитекст</button>
            <button type="button" data-action="copy-link">Копилинк</button>
            <button type="button" data-action="font" data-keep-open>Шрифт</button>
            <button type="button" data-action="size-inc" data-keep-open>+</button>
            <button type="button" data-action="size-dec" data-keep-open>−</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <textarea class="editor" id="editor" rows="1" placeholder="Ввод..." spellcheck="false"></textarea>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="passrow">
      <button class="act" id="btnUnpack">↶</button>
      <input class="pw" id="pw" type="text" maxlength="30" placeholder="••••••••••" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="nope-please-ignore" aria-label="Поле">
      <button class="act pack" id="btnPack">→</button>
    </div>
    <div class="mode-row">
      <span id="modeLabel"></span>
      <div class="mode-toggle" id="modeToggle" role="group" aria-label="Словарь">
        <button type="button" data-mode="names" class="active" id="modeNames">Имена</button>
        <button type="button" data-mode="tech" id="modeTech">Айти</button>
      </div>
    </div>
    <div class="modal-status" id="modalStatus" aria-live="polite"></div>
  </div>
</div>

<div class="overlay" id="infoModal">
  <div class="modal" role="dialog" aria-modal="true">
    <p class="info-text" id="infoText"></p>
  </div>
</div>

<div class="overlay" id="donateModal">
  <div class="modal" role="dialog" aria-modal="true">
    <p class="info-text" id="donateText"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

        document.body.removeChild(ta);
        if (ok) resolve();
        else reject(new Error('copy failed'));
      } catch (err) {
        document.body.removeChild(ta);
        reject(err);
      }
    });
  }

  function doCopyText() {
    var text = editor.value;
    if (!text) return;
    copyToClipboard(text).then(function () {
      showToast(i18n[isEN ? 'en' : 'ru'].copied, 2000);
    }).catch(function () {
      showToast(i18n[isEN ? 'en' : 'ru'].copyError, 2000);
    });
  }

  function doCopyLink() {
    copyToClipboard(location.href).then(function () {
      showToast(i18n[isEN ? 'en' : 'ru'].linkCopied, 2000);
    }).catch(function () {
      showToast(i18n[isEN ? 'en' : 'ru'].copyError, 2000);
    });
  }

  function doClear() {
    editor.value = '';
    setHash('');
    grow();
  }

  function dispatchAction(action) {
    if (action === 'theme') toggleTheme();
    else if (action === 'download') downloadOffline();
    else if (action === 'donate') showModal(donateModal);
    else if (action === 'info') showModal(infoModal);
    else if (action === 'clear') doClear();
    else if (action === 'copy-text') doCopyText();
    else if (action === 'copy-link') doCopyLink();
    else if (action === 'font') cycleFont();
    else if (action === 'size-inc') changeSize(2);
    else if (action === 'size-dec') changeSize(-2);
  }

  function bindMenu(menu, dd) {
    menu.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var action = b.dataset.action;
        if (!b.hasAttribute('data-keep-open')) {
          dd.close();
        }
        dispatchAction(action);
      });
    });
  }

  bindMenu(desktopMenu, desktopDD);
  bindMenu(mobileMenu, mobileDD);

  $('go').addEventListener('click', openModal);
  $('goM').addEventListener('click', openModal);

  function doPack() {
    var text = editor.value;
    var pw = pwInput.value;
    var t = i18n[isEN ? 'en' : 'ru'];
    if (!text) { setModalStatus(t.errEmpty, 'err'); return; }
    if (pw.length < 6 || pw.length > 30) { setModalStatus(t.errLen, 'err'); return; }
    if (!HAS_SUBTLE) { setModalStatus(t.errError, 'err'); return; }

    lockBtns(true);
    setModalStatus('…');
    ep(text, pw).then(function (rawHash) {
      if (!rawHash) { setModalStatus(t.errError, 'err'); return; }
      var prefix = currentMode === 'tech' ? 't-' : 'n-';
      var payload = currentMode === 'tech' ? bytesToTech(rawHash) : bytesToNames(rawHash);
      var outHash = prefix + payload;
      editor.value = outHash;
      grow();
      closeModal();
      if (outHash.length > MAX_URL_LEN) {
        setHash('');
        setTimeout(function () { showToast(t.errLong, 4000); }, 100);
      } else {
        setHash(outHash);
      }
    }).catch(function () {
      setModalStatus(t.errError, 'err');
    }).then(function () {
      lockBtns(false);
    });
  }

  function doUnpack() {
    var raw = extractHash(editor.value);
    var pw = pwInput.value;
    var t = i18n[isEN ? 'en' : 'ru'];
    if (!raw) { setModalStatus(t.errEmpty, 'err'); return; }
    if (pw.length < 6 || pw.length > 30) { setModalStatus(t.errLen, 'err'); return; }
    if (!HAS_SUBTLE) { setModalStatus(t.errError, 'err'); return; }
    lockBtns(true);
    setModalStatus('…');
    var bytes = null;
    if (raw.indexOf('t-') === 0) bytes = techToBytes(raw.slice(2));
    else if (raw.indexOf('n-') === 0) bytes = namesToBytes(raw.slice(2));
    else {
      bytes = namesToBytes(raw);
      if (!bytes) bytes = techToBytes(raw);
    }
    if (!bytes) {
      setModalStatus(t.errFail, 'err');
      lockBtns(false);
      return;
    }
    dp(bytes, pw).then(function (text) {
      if (text === null || text === '') { setModalStatus(t.errFail, 'err'); return; }
      editor.value = text;
      setHash('');
      grow();
      closeModal();
    }).catch(function () {
      setModalStatus(t.errError, 'err');
    }).then(function () {
      lockBtns(false);
    });
  }

  btnPack.addEventListener('click', doPack);
  btnUnpack.addEventListener('click', doUnpack);
  pwInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); doPack(); }
  });

  if (location.hash && location.hash.length > 1) {
    var fromHash = extractHash(location.hash);
    if (fromHash) { editor.value = fromHash; setHash(fromHash); grow(); }
  }

  applyMode('names');
  applyLang('ru');

})();
</script>
</body>
</html>
